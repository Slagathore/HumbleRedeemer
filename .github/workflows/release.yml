name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            artifact: HumbleRedeemer-windows
            binary: HumbleRedeemer.exe
            # windowed tray app with the key icon; helper consoles stay hidden
            buildflags: >-
              --windowed --icon static/icon.ico
              --version-file version_info.txt
              --hidden-import pystray --hidden-import pystray._win32
          - os: macos-latest
            sep: ":"
            artifact: HumbleRedeemer-macos
            binary: HumbleRedeemer
            buildflags: "--console"
          - os: ubuntu-latest
            sep: ":"
            artifact: HumbleRedeemer-linux
            binary: HumbleRedeemer
            buildflags: "--console"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp release version
        shell: bash
        # baked into the build; the in-app update check compares this tag
        # against the newest GitHub release
        run: echo "$GITHUB_REF_NAME" > static/version.txt

      - name: Windows version resource
        if: runner.os == 'Windows'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r A B C _ <<< "$V.0"
          cat > version_info.txt <<EOF
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=(${A:-0}, ${B:-0}, ${C:-0}, 0),
              prodvers=(${A:-0}, ${B:-0}, ${C:-0}, 0),
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1,
              subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'Slagathore'),
                StringStruct('FileDescription', 'Humble Steam Key Redeemer'),
                StringStruct('FileVersion', '$V'),
                StringStruct('ProductName', 'Humble Steam Key Redeemer'),
                StringStruct('ProductVersion', '$V'),
                StringStruct('LegalCopyright', 'MIT License'),
                StringStruct('OriginalFilename', 'HumbleRedeemer.exe')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])])
          EOF

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --name HumbleRedeemer
          ${{ matrix.buildflags }}
          --add-data "static${{ matrix.sep }}static"
          --collect-all selenium --collect-submodules steam
          --hidden-import fuzzywuzzy app.py

      # Signs dist/HumbleRedeemer.exe with Azure Artifact Signing, so Windows
      # stops warning about an unknown publisher. Skipped (release still
      # works, just unsigned) until these repo secrets are configured —
      # account details live in Cole's CODE-SIGNING-PLAYBOOK.md (see SIGNING.md):
      #   AZURE_TENANT_ID        — Entra tenant id
      #   AZURE_CLIENT_ID        — service principal (client) id
      #   AZURE_CLIENT_SECRET    — client secret for that principal
      #   AZURE_SIGNING_ENDPOINT — https://cus.codesigning.azure.net
      #   AZURE_SIGNING_ACCOUNT  — signing account name (Slagathores-Apps)
      #   AZURE_CERT_PROFILE     — certificate profile name (public)
      # The principal needs the "Artifact Signing Certificate Profile Signer"
      # role on the signing account (the pre-rebrand "Trusted Signing ..."
      # role name no longer exists). Until secrets exist, releases are signed
      # locally via build_release.ps1 + `gh release upload --clobber`.
      - name: Sign Windows exe (Azure Artifact Signing)
        if: runner.os == 'Windows' && secrets.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp "dist/${{ matrix.binary }}" pkg/
          cp README.md pkg/
          cd pkg
          case "$RUNNER_OS" in
            Windows)
              # bare exe as its own download, plus a zip with the README
              cp HumbleRedeemer.exe ..
              python -m zipfile -c "../${{ matrix.artifact }}.zip" . ;;
            macOS)
              # zip preserves the executable bit (unlike python -m zipfile)
              zip -r "../${{ matrix.artifact }}.zip" . ;;
            Linux)
              tar czf "../${{ matrix.artifact }}.tar.gz" . ;;
          esac

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            HumbleRedeemer.exe
          body: |
            **Humble Steam Key Redeem...er** — unzip, run the binary, and the
            dashboard opens at http://127.0.0.1:5757 (view it in any browser).
            The hidden automation browser uses Chrome or Firefox; Selenium
            usually downloads a private copy of Chrome if neither is installed.

            On Windows the app lives in the **system tray** (blue key icon by
            the clock): closing the browser tab leaves it running; right-click
            the icon to reopen the dashboard or quit. Troubleshooting output
            goes to `app.log` next to the exe. The app checks this repo for
            updates at launch and shows a banner in the dashboard when a newer
            release exists (silence it per-update or forever in Settings).

            Everything is 100% local and private — see the README's Privacy
            and Disclaimer sections.

            macOS note: the binary is unsigned; right-click → Open the first
            time to get past Gatekeeper.
